; mypy configuration.
;
; `make lint` runs mypy over the whole tree and the tree is expected to be CLEAN — 1114 errors
; were fixed in one pass to get there, so a new error is a real signal rather than noise to
; scroll past. Please keep it that way.
;
; There is deliberately no global `ignore_missing_imports` and no blanket suppression here. The
; only override is the one library that genuinely cannot be typed: pytesseract ships no py.typed
; marker and no `types-pytesseract` package exists on PyPI, so there is nothing to install. Every
; other third-party gap is closed by a real stub package in requirements.in (types-croniter,
; pandas-stubs) rather than by silencing it.
;
; If you are tempted to add a module here, install its stubs instead. If stubs do not exist, say
; so in the comment like the entry below does.

[mypy]
; Silences 81 advisory notes, NOT errors. Every one says the same thing: "the body of this
; untyped function was not checked, consider --check-untyped-defs". That is an invitation to a
; stricter mode this codebase has never run under — switching it on surfaces 1331 further errors,
; a larger job than the 1114 that were just cleared, and a deliberate decision rather than a
; side effect of tidying the output. Until someone takes that on, the notes only bury the
; `Success` line, so they are off.
;
; If you DO take it on: delete this line, set `check_untyped_defs = True`, and expect a long haul.
disable_error_code = annotation-unchecked

[mypy-pytesseract.*]
ignore_missing_imports = True
